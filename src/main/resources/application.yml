spring:
  application:
    name: lab-equipment-system
  datasource:
    url: ${LAB_DB_URL:jdbc:mysql://localhost:3306/lab_equipment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${LAB_DB_USERNAME:root}
    password: ${LAB_DB_PASSWORD:mysql@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: ${LAB_SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: warn
